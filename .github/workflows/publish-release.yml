name: Publish binaries on release
on:
  release:
    types: [published]
permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build package for x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev

      - name: Build x86_64 package
        run: |
          make
          make PREFIX=tmp install
          cd tmp
          tar czf ../libkrunfw-x86_64.tar.gz lib64
          cd ..
          rm -fr tmp
          sha256sum libkrunfw-x86_64.tar.gz > libkrunfw-x86_64.tar.gz.sha256
          gh release upload ${{github.event.release.tag_name}} libkrunfw-x86_64.tar.gz libkrunfw-x86_64.tar.gz.sha256
          make clean
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash

  build-aarch64:
    name: Build package for aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Code checkout
        uses: actions/checkout@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev

      - name: Build aarch64 package
        run: |
          make
          make PREFIX=tmp install
          mkdir libkrunfw
          cp Makefile LICENSE-* kernel.c bin2cbundle.py libkrunfw
          tar czf libkrunfw-prebuilt-aarch64.tar.gz libkrunfw
          rm -fr libkrunfw
          cd tmp
          tar czf ../libkrunfw-aarch64.tar.gz lib64
          cd ..
          rm -fr tmp
          sha256sum libkrunfw-prebuilt-aarch64.tar.gz > libkrunfw-prebuilt-aarch64.tar.gz.sha256
          sha256sum libkrunfw-aarch64.tar.gz > libkrunfw-aarch64.tar.gz.sha256
          gh release upload ${{github.event.release.tag_name}} libkrunfw-prebuilt-aarch64.tar.gz libkrunfw-prebuilt-aarch64.tar.gz.sha256
          gh release upload ${{github.event.release.tag_name}} libkrunfw-aarch64.tar.gz libkrunfw-aarch64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash

      - name: Upload kernel.c for macOS build
        uses: actions/upload-artifact@v4
        with:
          name: kernel-c-aarch64
          path: kernel.c

      - name: Clean
        run: make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- clean

  build-darwin-aarch64:
    name: Build dylib for macOS aarch64
    needs: build-aarch64
    runs-on: macos-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v2

      - name: Download kernel.c
        uses: actions/download-artifact@v4
        with:
          name: kernel-c-aarch64

      - name: Build macOS dylib
        run: |
          make
          make PREFIX=tmp install
          cd tmp
          tar czf ../libkrunfw-darwin-aarch64.tar.gz lib
          cd ..
          rm -fr tmp
          shasum -a 256 libkrunfw-darwin-aarch64.tar.gz > libkrunfw-darwin-aarch64.tar.gz.sha256
          gh release upload ${{github.event.release.tag_name}} libkrunfw-darwin-aarch64.tar.gz libkrunfw-darwin-aarch64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash
